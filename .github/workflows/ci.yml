name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # themes/ must match the generator, the layout and the current mistpine spec.
    # rofi 1.7.5 and 2.0 (in Docker) must load both files and resolve every color to the spec.
    uses: mistpine/port-kit/.github/workflows/port.yml@v0.1.0
    with:
      verify: true
